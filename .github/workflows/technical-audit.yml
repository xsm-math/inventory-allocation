name: Full inventory technical audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/reproduce.py
      - run: python scripts/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-technical-audit
          path: |
            results/reproduced/
            results/audit-generated/
