name: Inventory frozen policy-resource decisions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m supplychain.decision_study --stage validate --output results/decision-study-ci
      - run: python -m supplychain.decision_study --stage test --output results/decision-study-ci
      - run: python -m supplychain.decision_study --stage report --output results/decision-study-ci
      - run: python scripts/decision_diagnostics.py --run-dir results/decision-study-ci
      - run: python scripts/verify_decision_evidence.py --run-dir results/decision-study-ci
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-frozen-policy-resource-decisions
          path: results/decision-study-ci/
