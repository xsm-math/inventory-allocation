name: Inventory service-target study
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m supplychain.frontier --stage validate --output results/service-frontier-ci
      - run: python -m supplychain.frontier --stage test --output results/service-frontier-ci
      - run: python scripts/capacity_bound.py --run-dir results/service-frontier-ci
      - run: python -m supplychain.frontier --stage report --output results/service-frontier-ci
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-service-target-study
          path: results/service-frontier-ci/
